<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="100%" height="260" style="background: #080c16; border-radius: 12px; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Background Linear Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0e172e"/>
      <stop offset="100%" stop-color="#070a14"/>
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#4facfe"/>
      <stop offset="100%" stop-color="#7f00ff"/>
    </linearGradient>

    <linearGradient id="scanner-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00f2fe" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="dot-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="tech-grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.6"/>
      <circle cx="0" cy="0" r="1.2" fill="#38bdf8" fill-opacity="0.3"/>
    </pattern>

    <!-- Scan Line Animation -->
    <filter id="glow-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bg-grad)"/>

  <!-- Background Grid -->
  <rect width="100%" height="100%" fill="url(#tech-grid)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="120" cy="60" r="140" fill="#38bdf8" opacity="0.08" filter="url(#glow-blur)"/>
  <circle cx="860" cy="180" r="160" fill="#a855f7" opacity="0.08" filter="url(#glow-blur)"/>

  <!-- Dynamic Scanning Laser Beam in Background -->
  <g opacity="0.75">
    <rect x="0" y="0" width="960" height="28" fill="url(#scanner-grad)">
      <animate attributeName="y" values="0;232;0" dur="6s" repeatCount="indefinite" ease="easeInOut" />
    </rect>
    <line x1="0" y1="14" x2="960" y2="14" stroke="#00f2fe" stroke-width="1.5" stroke-opacity="0.65" filter="url(#glow-blur)">
      <animate attributeName="y1" values="14;246;14" dur="6s" repeatCount="indefinite" ease="easeInOut" />
      <animate attributeName="y2" values="14;246;14" dur="6s" repeatCount="indefinite" ease="easeInOut" />
    </line>
  </g>

  <!-- Animated Visual Search Viewfinder Reticle (Camera Focus) -->
  <g transform="translate(80, 50)" opacity="0.85">
    <!-- Top-Left Corner -->
    <path d="M 0 24 L 0 0 L 24 0" fill="none" stroke="#00f2fe" stroke-width="2.5" stroke-linecap="round">
      <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/>
    </path>
    <!-- Top-Right Corner -->
    <path d="M 116 0 L 140 0 L 140 24" fill="none" stroke="#00f2fe" stroke-width="2.5" stroke-linecap="round">
      <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/>
    </path>
    <!-- Bottom-Left Corner -->
    <path d="M 0 116 L 0 140 L 24 140" fill="none" stroke="#00f2fe" stroke-width="2.5" stroke-linecap="round">
      <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/>
    </path>
    <!-- Bottom-Right Corner -->
    <path d="M 116 140 L 140 140 L 140 116" fill="none" stroke="#00f2fe" stroke-width="2.5" stroke-linecap="round">
      <animate attributeName="stroke-opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/>
    </path>
    <!-- Focus Center Target -->
    <circle cx="70" cy="70" r="18" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.7">
      <animateTransform attributeName="transform" type="rotate" from="0 70 70" to="360 70 70" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="70" cy="70" r="3.5" fill="#00f2fe">
      <animate attributeName="r" values="2.5;4.5;2.5" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Right Side Decorative Neural Matching Graph -->
  <g transform="translate(770, 45)" opacity="0.6">
    <circle cx="80" cy="30" r="6" fill="#38bdf8" />
    <circle cx="130" cy="70" r="5" fill="#818cf8" />
    <circle cx="50" cy="110" r="6" fill="#c084fc" />
    <circle cx="110" cy="130" r="4" fill="#38bdf8" />
    <line x1="80" y1="30" x2="130" y2="70" stroke="#475569" stroke-width="1.2" stroke-dasharray="3 3"/>
    <line x1="130" y1="70" x2="110" y2="130" stroke="#475569" stroke-width="1.2"/>
    <line x1="80" y1="30" x2="50" y2="110" stroke="#475569" stroke-width="1.2"/>
    <line x1="50" y1="110" x2="110" y2="130" stroke="#475569" stroke-width="1.2" stroke-dasharray="3 3"/>
    <!-- Pulsing Match Connection -->
    <line x1="80" y1="30" x2="110" y2="130" stroke="#00f2fe" stroke-width="1.5" stroke-opacity="0.8">
      <animate attributeName="stroke-opacity" values="0.1;0.9;0.1" dur="2.5s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- FOREGROUND CONTENT: Header, Badges & Typography -->
  <g transform="translate(260, 48)">
    <!-- Top Pill / Category Tag -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="220" height="24" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <circle cx="12" cy="12" r="4" fill="#10b981">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="24" y="16" fill="#94a3b8" font-size="11" font-weight="600" letter-spacing="1">CURATED AWESOME LIST</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="62" fill="#ffffff" font-size="30" font-weight="800" letter-spacing="-0.5">
      Visual Search <tspan fill="url(#primary-glow)">&amp; Discovery APIs</tspan>
    </text>

    <!-- Subtitle / Meta Description -->
    <text x="0" y="94" fill="#94a3b8" font-size="14.5" font-weight="400" letter-spacing="0.1">
      Multimodal CLIP Embeddings • E-Commerce Product Matching • Reverse Image Search
    </text>

    <!-- Feature Pills / Highlights -->
    <g transform="translate(0, 118)">
      <!-- Pill 1: Multimodal Vector Search -->
      <g transform="translate(0, 0)">
        <rect x="0" y="0" width="170" height="28" rx="6" fill="#0f172a" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6"/>
        <text x="12" y="18" fill="#38bdf8" font-size="11.5" font-weight="600">⚡ Sub-100ms Ingestion</text>
      </g>

      <!-- Pill 2: Vision-Language Models -->
      <g transform="translate(182, 0)">
        <rect x="0" y="0" width="175" height="28" rx="6" fill="#0f172a" stroke="#818cf8" stroke-width="1" stroke-opacity="0.6"/>
        <text x="12" y="18" fill="#818cf8" font-size="11.5" font-weight="600">🧠 CLIP &amp; Tensor Search</text>
      </g>

      <!-- Pill 3: SaaS & Open Source -->
      <g transform="translate(369, 0)">
        <rect x="0" y="0" width="168" height="28" rx="6" fill="#0f172a" stroke="#c084fc" stroke-width="1" stroke-opacity="0.6"/>
        <text x="12" y="18" fill="#c084fc" font-size="11.5" font-weight="600">🌐 Enterprise &amp; Self-Host</text>
      </g>
    </g>
  </g>
</svg>
